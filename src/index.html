<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MMSPlayClient</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applies the theme before Angular boots, so a dark page never flashes white.
    // Same storage key and fallback as core/theme/color-theme.ts.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('mms-play.theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
