<h2 class="heading">View</h2>

<div class="segmented" role="group" aria-label="Notation">
  @for (option of staveViews; track option.value) {
    <button
      type="button"
      [class.active]="view().staveView === option.value"
      (click)="staveViewChange.emit(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>

<div class="segmented" role="group" aria-label="Layout">
  @for (option of layouts; track option.value) {
    <button
      type="button"
      [class.active]="view().layout === option.value"
      (click)="layoutChange.emit(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>

<label class="field">
  Zoom
  <select (change)="onZoom($event)">
    @for (level of zoomLevels; track level) {
      <option [value]="level" [selected]="level === view().zoom">{{ level * 100 }}%</option>
    }
  </select>
</label>
